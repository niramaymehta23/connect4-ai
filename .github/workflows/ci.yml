name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core tests (neural tests require PyTorch and run in the next job)
        run: python -m unittest discover -s tests -v
      - name: Comparison smoke test
        run: python scripts/compare.py --a minimax --b random --depth 2 --pairs 3 --seed 23 --output runs/core.json

  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Full test suite
        run: python -m unittest discover -s tests -v
      - name: Train and reload a tiny checkpoint
        run: |
          python scripts/learn.py --run runs/ci --iterations 1 --games 1 --simulations 8 --steps 1 --batch-size 8 --eval-pairs 1 --seed 23
          python scripts/compare.py --a neural-mcts --b random --simulations 8 --checkpoint runs/ci/champion.pt --pairs 2 --seed 999 --output runs/ci-eval.json
